name: Build XMRig Android Modern

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Node 16
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: yarn

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "cmake;3.18.1" \
            "ndk;21.4.7075529"

      - name: Install JavaScript dependencies
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn install --frozen-lockfile

      - name: Build XMRig 6.26.0 ARM64 with TLS
        shell: bash
        run: |
          set -euo pipefail
          cd xmrig/lib-builder
          rm -rf build
          mkdir -p build/src build/build
          make all
          cd ../..
          test -s android/app/src/main/jniLibs/arm64-v8a/libxmrig.so
          file android/app/src/main/jniLibs/arm64-v8a/libxmrig.so
          sha256sum android/app/src/main/jniLibs/arm64-v8a/libxmrig.so

      - name: Build installable ARM64 APK
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug -PreactNativeArchitectures=arm64-v8a
          cd ..

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/31.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" XMRig-Android-Modern-v1.0.apk
          sha256sum XMRig-Android-Modern-v1.0.apk | tee XMRig-Android-Modern-v1.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XMRig-Android-Modern-v1.0
          path: |
            XMRig-Android-Modern-v1.0.apk
            XMRig-Android-Modern-v1.0.apk.sha256
          if-no-files-found: error
